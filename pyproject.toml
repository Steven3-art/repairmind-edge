[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repairmind-edge"
version = "0.1.0"
description = "Agentic vision for evidence-driven inspection and troubleshooting of electronic and edge devices."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Belinga Belinga Steve" }
]
dependencies = [
    "numpy>=2.0,<3.0",
    "opencv-python==5.0.0.93",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
repairmind = "repairmind_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true